<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f380f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>하루치 - 햄스터 다마고치 🐹</title>
  <link rel="icon" type="image/png" href="assets/hamster/normal.png">

  <!-- 링크 공유 시 미리보기 (카톡, SNS 등) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="하루치 - 햄스터 다마고치 🐹" />
  <meta property="og:description" content="귀여운 햄스터 하루치를 키워보세요! 밥 주기, 물 주기, 쓰다듬기로 레벨업!" />
  <meta property="og:image" content="/assets/Thumbnail_og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="822" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="하루치 - 햄스터 다마고치 🐹" />
  <meta name="twitter:image" content="/assets/Thumbnail_og.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap"
    rel="stylesheet">
  <script>
    /* === 2026-02-20 Update v3 (UI & Notion Sync) === */
    window.APP_TIER = (function () {
      if (typeof location === 'undefined') return 'basic';
      var params = new URLSearchParams(location.search);
      var tierParam = params.get('tier');
      if (tierParam === 'pro' || tierParam === 'basic') return tierParam;
      var h = location.hostname || '';
      if (h.includes('haruchipro') || h.includes('-pro') || h.includes('.pro.')) return 'pro';
      /* 로컬 Live Server: Pro 프리뷰 기본 (노션 없이 UI만). ?tier=basic 또는 토글로 Basic 전환 */
      if (/^(localhost|127\.0\.0\.1)$/i.test(h)) {
        try {
          var saved = localStorage.getItem('haruchi_dev_tier');
          if (saved === 'basic' || saved === 'pro') return saved;
        } catch (_) { /* private mode */ }
        return 'pro';
      }
      return 'basic';
    })();
    window.IS_PRO = window.APP_TIER === 'pro';

    /* 디버그 모드 감지 (?debug=1 파라미터) */
    (function () {
      if (location.search.includes('debug=1')) {
        document.body.setAttribute('data-debug-buttons', '1');
      }
    })();

    /* [중요] 노션 임베드 깜빡임 방지 커스텀 헤드 스크립트 */
    (function () {
      var isNotion = (location.search.includes('notion=1')) || (window.self !== window.top);
      if (isNotion) {
        document.documentElement.classList.add('notion-auto-start');
        document.documentElement.classList.add('notion-embed');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body id="haruchiBody">

    <source src="./assets/audio/opening.mp3" type="audio/mpeg">
  </audio>
  <!-- 게임 BGM (게임 플레이 시 전용, 무한 반복) -->

    <source src="./assets/audio/game_bgm.mp3" type="audio/mpeg">
  </audio>

    </div>
  </div>

          <div class="water-bottle-click-area" onclick="handleWaterBottleClick()" title="클릭: 물 마시기"

        <div class="panel-gap"></div>

        <div class="screen-bottom">

              </div>

              <div class="exp-track">
                <div class="exp-fill" id="uiExp"></div>
              </div>

              <div class="goal-row">
                <span class="goal-label" data-i18n="goal">목표</span>
                <span>
                  <span class="goal-progress" id="goalProgress">0/5</span>
                  <span class="goal-percent" id="goalPercent">0%</span>
                </span>
              </div>

              <div class="title-row" id="titleRow">
                <span class="hamster-title" id="hamsterTitle">새내기 하루치</span>
              </div>
            </div>
          </div>
          <div class="panel-right">
            <div class="panel-content-clickable log-panel-clickable" onclick="openLogModal()" title="클릭하면 전체 로그 보기"
              data-i18n-title="tooltip_log">

              </div>
            </div>

        </div>

        <div class="layer-frame">
          <img src="" class="frame-img" id="frameImg" alt="Frame">
          <img src="./assets/logo2.png" class="device-logo" id="deviceLogo">

        </div>

    <!-- 그루밍 애니메이션 프레임 조정 패널 -->

        <div class="grooming-adjust-section">
          <label>행 1 Y 오프셋 (px)</label>

        </div>
        <div class="grooming-adjust-section">
          <label>행 2 Y 오프셋 (px)</label>

        <div class="grooming-adjust-section">

        </div>
        <div class="grooming-adjust-buttons">
          <button type="button" class="grooming-adjust-btn" onclick="resetGroomingValues()">초기화</button>

    <div class="stats-modal" id="statsModal">

        </div>

    </div>

    <div class="stats-modal" id="logModal">
      <div class="stats-panel log-modal-panel">
        <button class="stats-close" onclick="closeLogModal()">×</button>
        <div class="stats-title" data-i18n="system_log_title">📋 SYSTEM LOG</div>
        <div class="log-modal-content" id="logModalContent"></div>
      </div>
    </div>

  </div>
  </div>
  <div class="credit-game" data-i18n="credit">제작 by bbaekyohan</div>

  <script>
    (function initDevTierToggle() {
      var isLocal = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname || '');
      if (!isLocal) return;
      document.addEventListener('DOMContentLoaded', function () {
        var root = document.getElementById('devTierToggle');
        if (!root) return;
        root.hidden = false;
        var current = window.APP_TIER;
        root.querySelectorAll('.dev-tier-btn').forEach(function (btn) {
          var tier = btn.getAttribute('data-tier');
          btn.classList.toggle('is-active', tier === current);
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (tier === current) return;
            try { localStorage.setItem('haruchi_dev_tier', tier); } catch (_) { /* ignore */ }
            var url = new URL(location.href);
            url.searchParams.set('tier', tier);
            location.assign(url.toString());
          });
        });
      });
    })();
  </script>
  <script src="js/game.js"></script>

  <!-- Vercel Speed Insights: 웹사이트 성능 모니터링 -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
